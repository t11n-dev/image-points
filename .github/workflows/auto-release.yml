name: Auto Release ZIP

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Create ZIP from repo
        run: |
          # Pack the files inside an 'image-points/' folder prefix for clean WP installations
          git archive --format=zip --prefix=image-points/ --output=image-points.zip HEAD

      - name: Delete Old Latest Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Safely delete the old 'Latest' release and clean up the remote tag if it exists
          gh release delete Latest --yes --cleanup-tag || true

      - name: Create New GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Create the fresh 'Latest' release, upload the zip, and tag it
          gh release create Latest image-points.zip \
            --target "$GITHUB_SHA" \
            --title "Image Points" \
            --notes "Auto release of the latest Image Points plugin. Compiled for production. Commit: $GITHUB_SHA"